{% extends 'baseDesing.html'%}

{% block title %}Nueva publicación | FayucaPlace{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h5 fw-semibold mb-3">Nueva publicación</h1>
                <div id="error-container" class="text-danger small mb-2"></div>
                <form id="new-article-form" novalidate enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_titulo" class="form-label">Título</label>
                        <input type="text" name="titulo" id="id_titulo" class="form-control" required>
                        <div id="error-titulo" class="error-message text-danger small"></div>
                    </div>
                    <div class="mb-3">
                        <label for="id_descripcion" class="form-label">Descripción</label>
                        <textarea name="descripcion" id="id_descripcion" class="form-control" rows="4" required></textarea>
                        <div id="error-descripcion" class="error-message text-danger small"></div>
                    </div>
                    <div class="mb-3">
                        <label for="id_imagen" class="form-label">Imagen (opcional)</label>
                        <input type="file" name="imagen" id="id_imagen" class="form-control" accept="image/*">
                        <div id="error-imagen" class="error-message text-danger small"></div>
                    </div>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="id_precio" class="form-label">Precio</label>
                            <input type="number" name="precio" id="id_precio" step="0.01" class="form-control" required>
                            <div id="error-precio" class="error-message text-danger small"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="id_cantidad" class="form-label">Cantidad</label>
                            <input type="number" name="cantidad" id="id_cantidad" class="form-control" required>
                            <div id="error-cantidad" class="error-message text-danger small"></div>
                        </div>
                    </div>
                    <div class="row g-3 mt-1">
                        <div class="col-md-6">
                            <label for="categoria" class="form-label">Categoría</label>
                            <select id="categoria" name="categoria" class="form-select">
                                <option value="" selected>---------</option>
                                {% for categoria in categorias %}
                                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="subcategoria" class="form-label">Subcategoría</label>
                            <select id="subcategoria" name="subcategoria" class="form-select" disabled required>
                                <option value="">-- Selecciona una categoría primero --</option>
                            </select>
                            <div id="error-subcategoria" class="error-message text-danger small"></div>
                        </div>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">Publicar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
const csrftoken = getCookie('csrftoken');

document.addEventListener('DOMContentLoaded', function() {
    // Dependent dropdown logic
    const categoriaSelect = document.getElementById('categoria');
    const subcategoriaSelect = document.getElementById('subcategoria');

    categoriaSelect.addEventListener('change', async function() {
        const categoriaId = this.value;
        subcategoriaSelect.innerHTML = '<option value="">Cargando...</option>';
        subcategoriaSelect.disabled = true;

        if (!categoriaId) {
            subcategoriaSelect.innerHTML = '<option value="">-- Selecciona una categoría primero --</option>';
            return;
        }

        try {
            const response = await fetch(`/api/subcategorias/?categoria=${categoriaId}`);
            if (!response.ok) throw new Error('Network response was not ok');
            const subcategorias = await response.json();

            subcategoriaSelect.innerHTML = '<option value="">---------</option>';
            subcategorias.forEach(sub => subcategoriaSelect.add(new Option(sub.nombre, sub.id)));
            subcategoriaSelect.disabled = false;
        } catch (error) {
            console.error('Error fetching subcategories:', error); // Log the error object
            if (error.response) { // If it's an HTTP error, try to log more details
                console.error('Response status:', error.response.status);
                error.response.json().then(errData => console.error('Response data:', errData)).catch(() => {});
            }
            subcategoriaSelect.innerHTML = '<option value="">Error al cargar</option>';
        }
    });

    // AJAX form submission logic
    const form = document.getElementById('new-article-form');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const fd = new FormData(form);
        // Adaptar a modo plano del serializer
        fd.append('subcategoria', document.getElementById('subcategoria').value);
        fd.append('precio', document.getElementById('id_precio').value);
        fd.append('cantidad', document.getElementById('id_cantidad').value);

        try {
            const response = await fetch('/api/publicaciones/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: fd
            });

            if (response.ok) {
                const newPublicacion = await response.json();
                window.location.href = `/article/${newPublicacion.id}/`;
            } else {
                let errors;
                try { errors = await response.json(); } catch { errors = {general: ['Error desconocido']}; }
                document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
                document.getElementById('error-container').textContent = '';

                for (const key in errors) {
                    const errorDiv = document.getElementById(`error-${key}`);
                    if(errorDiv) errorDiv.textContent = Array.isArray(errors[key]) ? errors[key].join(' ') : errors[key];
                }
            }
        } catch (error) {
            console.error('Submission error:', error);
            document.getElementById('error-container').textContent = 'Ocurrió un error al enviar el formulario.';
        }
    });
});
</script>
{% endblock %}
