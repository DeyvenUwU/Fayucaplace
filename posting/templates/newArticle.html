{% extends 'baseDesing.html'%}

{% block content %}
<div class="py-5">
    <!-- Header -->
    <div class="mb-5 pb-4 border-bottom">
        <h1 class="display-4 fw-bold mb-2"><i class="bi bi-plus-circle me-3" style="color: #0d6efd;"></i>Nueva publicación</h1>
        <p class="text-muted">Comparte tu artículo y conecta con compradores</p>
    </div>

    <!-- Alertas de Error -->
    <div id="error-container"></div>

    <!-- Formulario -->
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <form id="new-article-form">
                        {% csrf_token %}

                        <!-- Título -->
                        <div class="mb-4">
                            <label for="id_titulo" class="form-label fw-bold"><i class="bi bi-pencil me-2" style="color: #0d6efd;"></i>Título *</label>
                            <input type="text" name="titulo" id="id_titulo" class="form-control form-control-lg" placeholder="Ej: iPhone 12 Pro" required>
                            <div id="error-titulo" class="text-danger small mt-2"></div>
                        </div>

                        <!-- Descripción -->
                        <div class="mb-4">
                            <label for="id_descripcion" class="form-label fw-bold"><i class="bi bi-card-text me-2" style="color: #0d6efd;"></i>Descripción *</label>
                            <textarea name="descripcion" id="id_descripcion" class="form-control" rows="5" placeholder="Describe los detalles, condición, características principales..." required></textarea>
                            <div id="error-descripcion" class="text-danger small mt-2"></div>
                        </div>

                        <!-- Precio y Cantidad en fila -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="id_precio" class="form-label fw-bold"><i class="bi bi-cash-coin me-2" style="color: #0d6efd;"></i>Precio *</label>
                                <div class="input-group input-group-lg">
                                    <span class="input-group-text bg-light border-0">$</span>
                                    <input type="number" name="precio" id="id_precio" class="form-control" step="0.01" placeholder="0.00" required>
                                </div>
                                <div id="error-precio" class="text-danger small mt-2"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="id_cantidad" class="form-label fw-bold"><i class="bi bi-box me-2" style="color: #0d6efd;"></i>Cantidad *</label>
                                <div class="input-group input-group-lg">
                                    <input type="number" name="cantidad" id="id_cantidad" class="form-control" placeholder="1" required>
                                    <span class="input-group-text bg-light border-0">unidades</span>
                                </div>
                                <div id="error-cantidad" class="text-danger small mt-2"></div>
                            </div>
                        </div>

                        <!-- Condición -->
                        <div class="mb-4">
                            <label for="id_condicion" class="form-label fw-bold"><i class="bi bi-star me-2" style="color: #0d6efd;"></i>Condición *</label>
                            <select name="condicion" id="id_condicion" class="form-select form-select-lg" required>
                                <option value="">-- Selecciona una condición --</option>
                                <option value="NUEVO">✨ Nuevo</option>
                                <option value="USADO">↻ Usado</option>
                            </select>
                            <div id="error-condicion" class="text-danger small mt-2"></div>
                        </div>

                        <!-- Categoría y Subcategoría -->
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="categoria" class="form-label fw-bold"><i class="bi bi-tag me-2" style="color: #0d6efd;"></i>Categoría *</label>
                                <select id="categoria" name="categoria" class="form-select form-select-lg" required>
                                    <option value="" selected>-- Selecciona una categoría --</option>
                                    {% for categoria in categorias %}
                                    <option value="{{ categoria.id }}">{{ categoria.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="subcategoria" class="form-label fw-bold"><i class="bi bi-collection me-2" style="color: #0d6efd;"></i>Subcategoría *</label>
                                <select id="subcategoria" name="subcategoria" class="form-select form-select-lg" disabled required>
                                    <option value="">-- Selecciona una categoría primero --</option>
                                </select>
                                <div id="error-subcategoria" class="text-danger small mt-2"></div>
                            </div>
                        </div>

                        <!-- Imagen -->
                        <div class="mb-5">
                            <label for="id_imagen" class="form-label fw-bold"><i class="bi bi-image me-2" style="color: #0d6efd;"></i>Imagen (opcional)</label>
                            <div class="input-group">
                                <input type="file" name="imagen" id="id_imagen" class="form-control form-control-lg" accept="image/*">
                                <label class="input-group-text bg-light"><i class="bi bi-cloud-arrow-up"></i></label>
                            </div>
                            <small class="text-muted d-block mt-2">Formato: JPG, PNG. Tamaño máximo: 5MB</small>
                            <div id="error-imagen" class="text-danger small mt-2"></div>
                        </div>

                        <!-- Botones -->
                        <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
                            <button type="reset" class="btn btn-lg btn-outline-secondary"><i class="bi bi-arrow-clockwise me-2"></i>Limpiar</button>
                            <button type="submit" class="btn btn-lg btn-primary"><i class="bi bi-check-circle me-2"></i>Publicar artículo</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script>
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
const csrftoken = getCookie('csrftoken');

document.addEventListener('DOMContentLoaded', function() {
    // Dependent dropdown logic
    const categoriaSelect = document.getElementById('categoria');
    const subcategoriaSelect = document.getElementById('subcategoria');

    categoriaSelect.addEventListener('change', async function() {
        const categoriaId = this.value;
        subcategoriaSelect.innerHTML = '<option value="">Cargando...</option>';
        subcategoriaSelect.disabled = true;

        if (!categoriaId) {
            subcategoriaSelect.innerHTML = '<option value="">-- Selecciona una categoría primero --</option>';
            return;
        }

        try {
            const response = await fetch(`/api/subcategorias/?categoria=${categoriaId}`);
            if (!response.ok) throw new Error('Network response was not ok');
            const subcategorias = await response.json();

            subcategoriaSelect.innerHTML = '<option value="">---------</option>';
            subcategorias.forEach(sub => subcategoriaSelect.add(new Option(sub.nombre, sub.id)));
            subcategoriaSelect.disabled = false;
        } catch (error) {
            console.error('Error fetching subcategories:', error);
            subcategoriaSelect.innerHTML = '<option value="">Error al cargar</option>';
        }
    });

    // AJAX form submission logic
    const form = document.getElementById('new-article-form');
    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const formDataMultipart = new FormData();
        formDataMultipart.append('titulo', document.getElementById('id_titulo').value);
        formDataMultipart.append('descripcion', document.getElementById('id_descripcion').value);
        formDataMultipart.append('categoria', document.getElementById('categoria').value);
        formDataMultipart.append('subCategoria', document.getElementById('subcategoria').value);
        formDataMultipart.append('precio', document.getElementById('id_precio').value);
        formDataMultipart.append('cantidad', document.getElementById('id_cantidad').value);
        formDataMultipart.append('condicion', document.getElementById('id_condicion').value);
        
        const imagenInput = document.getElementById('id_imagen');
        if (imagenInput.files.length > 0) {
            formDataMultipart.append('imagen', imagenInput.files[0]);
        }

        try {
            const response = await fetch('/api/publicaciones/', {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: formDataMultipart
            });

            if (response.ok) {
                const newPublicacion = await response.json();
                window.location.href = `/article/${newPublicacion.id}/`;
            } else {
                const errors = await response.json();
                // Clear previous errors
                document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
                document.getElementById('error-container').textContent = '';

                for (const key in errors) {
                    if (key === 'articulo') {
                        for (const articuloKey in errors.articulo) {
                            const errorDiv = document.getElementById(`error-${articuloKey}`);
                            if(errorDiv) errorDiv.textContent = errors.articulo[articuloKey].join(' ');
                        }
                    } else {
                        const errorDiv = document.getElementById(`error-${key}`);
                        if(errorDiv) errorDiv.textContent = errors[key].join(' ');
                    }
                }
            }
        } catch (error) {
            console.error('Submission error:', error);
            document.getElementById('error-container').textContent = 'Ocurrió un error al enviar el formulario.';
        }
    });
});
</script>
{% endblock %}
