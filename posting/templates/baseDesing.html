{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ITSUR Marketplace</title>
    <link rel="stylesheet" href="{% static 'css/market.css' %}" />
  </head>
  <body>
    <nav>
      {% if user.is_authenticated%}
      <li><a href="/mainpanel">Pagina principal</a></li>
      <li><a href="/buy">Comprar</a></li>
      <li><a href="/newarticle">Vender</a></li>
      <li><a href="/newad">Anunciar</a></li>

      <li><a href="/editprofile">Editar perfil</a></li>
      <li><a href="/logout">Cerrar sesión</a></li>
      {% else %}
      <li><a href="/signup">Crear cuenta</a></li>
      <li><a href="/login">Ingresar</a></li>
      {% endif %}
    </nav>

    {% block content %} {% endblock %} {% block scripts %} {% endblock %}
  </body>
</html>
