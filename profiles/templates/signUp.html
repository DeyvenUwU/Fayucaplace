{% extends 'baseDesing.html'%}

{% block title %}Crear cuenta | FayucaPlace{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h4 fw-semibold mb-3">Crear cuenta</h1>
                {% if error %}
                    <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
                {% endif %}
                <form action="/signup/" method='POST' novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-2">
                        <button class="btn btn-primary" type="submit">Registrar</button>
                    </div>
                </form>
                <p class="small text-muted mt-3 mb-0">¿Ya tienes cuenta? <a href="/login" class="text-decoration-none">Ingresar</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}{% endblock %}
