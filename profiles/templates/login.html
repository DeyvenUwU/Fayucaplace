{% extends 'baseDesing.html'%}

{% block title %}Ingresar | FayucaPlace{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h1 class="h4 fw-semibold mb-3">Iniciar sesión</h1>
                {% if error %}
                    <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
                {% endif %}
                <form action="/login/" method="POST" class="needs-validation" novalidate>
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid mt-3">
                        <button class="btn btn-primary" type="submit">Ingresar</button>
                    </div>
                </form>
                <p class="small text-muted mt-3 mb-0">¿No tienes cuenta? <a href="/signup" class="text-decoration-none">Regístrate</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}{% endblock %}
