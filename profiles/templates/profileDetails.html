{% extends 'baseDesing.html'%}

{% block title %}Perfil | FayucaPlace{% endblock %}

{% block content %}
<div class="row justify-content-center">
	<div class="col-md-6 col-lg-5">
		<div class="card shadow-sm border-0">
			<div class="card-body p-4 text-center">
				<h1 class="h5 fw-semibold mb-3">Perfil de {{ user.username }}</h1>
				{% if user.profile.image %}
					<img src="{{ user.profile.image.url }}" alt="Foto de perfil" class="rounded-circle img-thumbnail mb-3" style="width:150px;height:150px;object-fit:cover;">
				{% endif %}
				<ul class="list-unstyled small text-muted mb-3">
					<li>Email: {{ user.profile.email|default:user.email }}</li>
				</ul>
				<a href="/editprofile" class="btn btn-outline-primary btn-sm">Editar</a>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}{% endblock %}
