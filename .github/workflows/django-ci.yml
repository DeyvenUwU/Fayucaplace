name: Django CI/CD Pipeline

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11, 3.12]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-django pytest-cov

    - name: Check for migrations
      run: |
        python manage.py makemigrations --check --dry-run --no-input
      env:
        DEBUG: 'True'
        DJANGO_SECRET_KEY: 'test-secret-key-for-ci'

    - name: Run Migrations
      run: |
        python manage.py migrate --no-input
      env:
        DEBUG: 'True'
        DJANGO_SECRET_KEY: 'test-secret-key-for-ci'

    - name: Run Tests
      run: |
        python manage.py test
      env:
        DEBUG: 'True'
        DJANGO_SECRET_KEY: 'test-secret-key-for-ci'

    - name: Check Code Quality (flake8)
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit safety

    - name: Run Bandit Security Scanner
      run: |
        bandit -r . -x ./venv,./venv.venvScriptsactivate -f json -o bandit-report.json || true
        bandit -r . -x ./venv,./venv.venvScriptsactivate
      continue-on-error: true

    - name: Check for Vulnerable Dependencies
      run: |
        safety check --json || true
        safety check
      continue-on-error: true

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Collect Static Files
      run: |
        python manage.py collectstatic --no-input --clear
      env:
        DEBUG: 'False'
        DJANGO_SECRET_KEY: 'test-secret-key-for-ci'
        ALLOWED_HOSTS: 'localhost,127.0.0.1'

    - name: Check Deployment Settings
      run: |
        python manage.py check --deploy --fail-level WARNING
      env:
        DEBUG: 'False'
        DJANGO_SECRET_KEY: 'test-secret-key-for-ci'
        ALLOWED_HOSTS: 'localhost,127.0.0.1'
      continue-on-error: true

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, security, build]
    if: always()
    
    steps:
    - name: Check Status
      run: |
        echo "Test Status: ${{ needs.test.result }}"
        echo "Security Status: ${{ needs.security.result }}"
        echo "Build Status: ${{ needs.build.result }}"
        
        if [[ "${{ needs.test.result }}" == "success" ]] && [[ "${{ needs.build.result }}" == "success" ]]; then
          echo "✅ All checks passed! Ready for deployment."
          exit 0
        else
          echo "❌ Some checks failed. Review the logs above."
          exit 1
        fi
